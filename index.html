<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="site-title"></title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body>

    <!-- ===== MENU SUPERIOR ===== -->
    <header id="main-header">
        <div class="container">
            <div class="logo">
                <img src="assets/images/isaric-top.png" alt="ISARIC" style="height: 40px; width: auto;">
                <div class="logo-text">
                    <strong id="logo-strong">ISARIC</strong>
                    <span id="logo-span">South America Hub</span>
                </div>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html" id="menu-home" class="active"></a></li>
                    <li><a href="pages/clinical.html" id="menu-clinical"></a></li>
                    <li><a href="pages/training.html" id="menu-training"></a></li>
                    <li><a href="pages/tools.html" id="menu-tools"></a></li>
                    <li><a href="pages/publications.html" id="menu-publications"></a></li>
                    <li><a href="pages/news.html" id="menu-news"></a></li>
                    <li><a href="pages/dashboard.html" id="menu-dashboard"></a></li>
                    <li><a href="pages/team.html" id="menu-team"></a></li>
                    <li><a href="pages/contact.html" id="menu-contact"></a></li>
                </ul>
            </nav>
            <div class="idioma">
                <button onclick="switchLanguage('pt')" id="lang-pt"></button>
                <span class="divider">|</span>
                <button onclick="switchLanguage('en')" id="lang-en" class="active"></button>
                <span class="divider">|</span>
                <button onclick="switchLanguage('es')" id="lang-es"></button>
            </div>
        </div>
    </header>

    <!-- ===== HERO ===== -->
    <section id="hero">
        <div class="hero-bg">
            <img src="assets/images/hero-lab.png" alt="Scientific research" id="hero-image">
            <div class="hero-overlay"></div>
        </div>
        <div class="container">
            <div class="hero-grid">
                <div class="hero-content">
                    <span class="hero-badge">
                        <span class="dot"></span>
                        <span id="hero-badge"></span>
                    </span>
                    <h1 id="hero-title"></h1>
                    <p id="hero-description"></p>
                    <div class="hero-buttons">
                        <a href="pages/clinical.html" class="btn-primary" id="hero-btn-explore"></a>
                        <a href="pages/news.html" class="btn-secondary" id="hero-btn-news"></a>
                    </div>
                    <div class="hero-stats">
                        <div class="stat-item">
                            <span class="stat-value" id="stat-records"></span>
                            <span class="stat-label" id="stat-records-label"></span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="stat-sites"></span>
                            <span class="stat-label" id="stat-sites-label"></span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="stat-countries"></span>
                            <span class="stat-label" id="stat-countries-label"></span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="stat-researchers"></span>
                            <span class="stat-label" id="stat-researchers-label"></span>
                        </div>
                    </div>
                </div>
                <div class="hero-card">
                    <!-- Será preenchido pelo JavaScript com os dados da planilha -->
                </div>
            </div>
        </div>
        <div class="hero-wave">
            <svg viewBox="0 0 1440 56" fill="none" preserveAspectRatio="none">
                <path d="M0 56V28C240 0 480 56 720 36 960 16 1200 46 1440 28V56H0Z" fill="#ffffff" />
            </svg>
        </div>
    </section>

    <!-- ===== ABOUT THE HUB ===== -->
    <section id="about-hub">
        <div class="container">
            <span class="section-tag" id="about-tag"></span>
            <h2 id="about-title"></h2>
            <div class="about-grid">
                <div class="about-text">
                    <p id="about-text-1"></p>
                    <p id="about-text-2"></p>
                    <p id="about-text-3"></p>
                </div>
                <div class="about-image">
                    <img src="assets/images/about-lab.png" alt="ISARIC South America Hub" id="about-image">
                    <div class="badge">
                        <div class="badge-tag" id="about-badge-tag"></div>
                        <div class="badge-title" id="about-badge-title"></div>
                        <div class="badge-date" id="about-badge-date"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ===== OUR WORK ===== -->
    <section id="our-work">
        <div class="container">
            <span class="section-tag" id="work-tag"></span>
            <h2 id="work-title"></h2>
            <p class="subtitle" id="work-subtitle"></p>
            <div class="work-grid">
                <!-- Card 1: Clinical -->
                <div class="work-card" data-color="red">
                    <div class="work-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 3h6M9 3v7L4.5 17A2 2 0 006.3 20h11.4a2 2 0 001.8-3L15 10V3" />
                            <path d="M7.5 15h9" />
                        </svg>
                    </div>
                    <span class="label" id="work-clinical-label"></span>
                    <h3 id="work-clinical-title"></h3>
                    <p id="work-clinical-text"></p>
                    <p style="margin-top: 4px; margin-bottom: 12px;">
                        <a href="https://redcap.fiocruz.br/redcap/surveys/?s=KT8WDKPLWFAYWLHE" target="_blank" id="work-clinical-register" style="font-weight: 600; color: #BA0225; font-size: 0.9rem;"></a>
                    </p>
                    <div class="footer-row">
                        <span class="tag" id="work-clinical-tag"></span>
                        <a href="pages/clinical.html" class="learn-link" id="work-clinical-link"></a>
                    </div>
                </div>
                <div class="work-card" data-color="teal">
                    <div class="work-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                            <path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5" />
                        </svg>
                    </div>
                    <span class="label" id="work-training-label"></span>
                    <h3 id="work-training-title"></h3>
                    <p id="work-training-text"></p>
                    <div class="footer-row">
                        <span class="tag" id="work-training-tag"></span>
                        <a href="pages/training.html" class="learn-link" id="work-training-link"></a>
                    </div>
                </div>
                <div class="work-card" data-color="gold">
                    <div class="work-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
                            <polyline points="3.27 6.96 12 12.01 20.73 6.96" />
                            <line x1="12" y1="22.08" x2="12" y2="12" />
                        </svg>
                    </div>
                    <span class="label" id="work-analytics-label"></span>
                    <h3 id="work-analytics-title"></h3>
                    <p id="work-analytics-text"></p>
                    <div class="footer-row">
                        <span class="tag" id="work-analytics-tag"></span>
                        <a href="pages/tools.html" class="learn-link" id="work-analytics-link"></a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ===== LATEST NEWS ===== -->
    <section id="latest-news">
        <div class="container">
            <div class="news-header">
                <div class="news-header-left">
                    <span class="section-tag" id="news-tag"></span>
                    <h2 id="news-title"></h2>
                </div>
                <a href="pages/news.html" class="all-link" id="news-all-link"></a>
            </div>
            <div class="news-grid">
                <div class="news-featured">
                    <img src="assets/news/default.png" alt="Featured news" id="news-featured-image">
                    <div class="content">
                        <span class="badge" id="news-featured-badge" style="background: #BA0225;"></span>
                        <div class="date" id="news-featured-date"></div>
                        <h3 id="news-featured-title"></h3>
                        <p id="news-featured-excerpt"></p>
                        <a href="#" class="read-link" id="news-featured-link"></a>
                    </div>
                </div>
                <div class="news-thumbs">
                    <div class="news-thumb">
                        <img src="assets/news/default.png" alt="News" id="news-thumb-1-image">
                        <div class="content">
                            <span class="badge" id="news-thumb-1-badge" style="background: #1A6B6B;"></span>
                            <div class="date" id="news-thumb-1-date"></div>
                            <h4 id="news-thumb-1-title"></h4>
                            <a href="#" class="read-link" id="news-thumb-1-link"></a>
                        </div>
                    </div>
                    <div class="news-thumb">
                        <img src="assets/news/default.png" alt="News" id="news-thumb-2-image">
                        <div class="content">
                            <span class="badge" id="news-thumb-2-badge" style="background: #D1964F;"></span>
                            <div class="date" id="news-thumb-2-date"></div>
                            <h4 id="news-thumb-2-title"></h4>
                            <a href="#" class="read-link" id="news-thumb-2-link"></a>
                        </div>
                    </div>
                    <div class="news-thumb">
                        <img src="assets/news/default.png" alt="News" id="news-thumb-3-image">
                        <div class="content">
                            <span class="badge" id="news-thumb-3-badge" style="background: #1A6B6B;"></span>
                            <div class="date" id="news-thumb-3-date"></div>
                            <h4 id="news-thumb-3-title"></h4>
                            <a href="#" class="read-link" id="news-thumb-3-link"></a>
                        </div>
                    </div>
                    <div class="news-thumb">
                        <img src="assets/news/default.png" alt="News" id="news-thumb-4-image">
                        <div class="content">
                            <span class="badge" id="news-thumb-4-badge" style="background: #4A4A4A;"></span>
                            <div class="date" id="news-thumb-4-date"></div>
                            <h4 id="news-thumb-4-title"></h4>
                            <a href="#" class="read-link" id="news-thumb-4-link"></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ===== MODAL DE NOTÍCIA COMPLETA ===== -->
    <div class="news-modal" id="news-modal" style="display:none;">
        <div class="news-modal-overlay" id="news-modal-overlay"></div>
        <div class="news-modal-content">
            <button class="news-modal-close" id="news-modal-close">✕</button>
            <button class="news-modal-back" id="news-modal-back">← Voltar para notícias</button>
            <div class="news-modal-body" id="news-modal-body">
                <!-- Conteúdo carregado pelo JS -->
            </div>
        </div>
    </div>

    <!-- ===== NEWSLETTER ===== -->
    <section id="newsletter">
        <div class="bg-image">
            <img src="assets/images/newsletter-bg.png" alt="Newsletter background" id="newsletter-bg">
        </div>
        <div class="overlay"></div>
        <div class="container">
            <span class="tag" id="newsletter-tag"></span>
            <h2 id="newsletter-title"></h2>
            <p id="newsletter-text"></p>
            <form onsubmit="event.preventDefault(); subscribeNewsletter();">
                <input type="email" id="newsletter-email" placeholder="" required>
                <button type="submit" class="btn-subscribe" id="newsletter-subscribe"></button>
            </form>
            <span class="note" id="newsletter-note"></span>
        </div>
    </section>

    <!-- ===== RODAPÉ ===== -->
    <footer id="main-footer">
        <div class="container">
            <div class="footer-grid">
                <div class="footer-brand">
                    <div class="logo">
                        <img src="assets/images/isaric-footer.png" alt="ISARIC" style="height: 40px; width: auto;">
                    </div>
                    <p id="footer-description"></p>
                    <a href="mailto:contact@isaric-sa.org.br" class="footer-email" id="footer-email">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="2" />
                            <path d="M2 7l10 7 10-7" />
                        </svg>
                        contact@isaric-sa.org.br
                    </a>
                    <div class="footer-social">
                        <a href="#" aria-label="LinkedIn" id="footer-linkedin">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6zM2 9h4v12H2z" />
                                <circle cx="4" cy="4" r="2" />
                            </svg>
                            LinkedIn
                        </a>
                    </div>
                </div>
                <div class="footer-col">
                    <h4 id="footer-links-title"></h4>
                    <ul>
                        <li><a href="index.html" id="footer-home"></a></li>
                        <li><a href="pages/clinical.html" id="footer-clinical"></a></li>
                        <li><a href="pages/news.html" id="footer-news"></a></li>
                        <li><a href="pages/training.html" id="footer-training"></a></li>
                        <li><a href="pages/publications.html" id="footer-publications"></a></li>
                        <li><a href="pages/contact.html" id="footer-contact"></a></li>
                    </ul>
                </div>
            </div>
            <div class="footer-bottom">
                <p id="footer-copyright"></p>
                <div class="footer-bottom-links">
                    <a href="#" id="footer-privacy"></a>
                    <a href="#" id="footer-terms"></a>
                    <a href="#" id="footer-accessibility"></a>
                </div>
            </div>
        </div>
    </footer>

    <!-- ===== SCRIPTS ===== -->
    
    <script src="js/dashboard-aria.js"></script>
    <script src="js/content-loader.js"></script>
    <script src="js/news.js"></script>
    <script src="js/index.js"></script>

</body>
</html>
